name: Publish API manually

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish, for example 12.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: HeavenCube/HCPlugins-actions/.github/workflows/publish-maven.yml@main
    with:
      gradle-task: ":core-api:publish"
      gradle-arguments: "--stacktrace -Pversion=${{ inputs.version }}"
    secrets: inherit
